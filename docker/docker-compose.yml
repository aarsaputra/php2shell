services:
  target:
    # Official Docker image, no local build:
    #   https://github.com/docker-library/php  (tag 8.4.26-apache)
    # Debian 12 base, Apache prefork + mod_php, PHP 8.4.26.
    image: php:8.4.26-apache
    platform: linux/amd64
    container_name: php2shell-target
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./php.ini:/usr/local/etc/php/conf.d/zz-php2shell.ini:ro
      - ./apache.conf:/etc/apache2/conf-enabled/zz-php2shell.conf:ro
      - ./www:/var/www/html:ro
      - ../out:/out
    # /out must be writable by the Apache worker (www-data, uid/gid 33) so it can
    # drop the proof file. 0770 + group www-data is enough for that and stays
    # NOT world-writable (no world-write + sticky bit): otherwise any local
    # user of the host could plant or overwrite artifacts that the operator
    # then reads as evidence.
    # `install -d` sets mode + ownership in one shot; the fallback covers images
    # where install(1) is missing.
    command:
      - /bin/sh
      - -c
      - >-
        install -d -m 0770 -o www-data -g www-data /out 2>/dev/null ||
        (chmod 0770 /out && chgrp www-data /out);
        exec apache2-foreground
    restart: unless-stopped
