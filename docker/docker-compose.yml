# docker-compose.yml — lab target rentan php2shell (R2-05 hardening)
#
# Perubahan dari versi sebelumnya (audit round 2):
#   1. `build:` dengan UID/GID mapping, bukan `image:` polos. Worker Apache
#      memakai uid/gid pemilik repo, jadi /out ditulis tanpa chown dari dalam
#      container (menghapus `install -d -o www-data` pada path host).
#   2. `read_only: true` + tmpfs hanya untuk direktori yang benar-benar perlu
#      ditulis Apache (run/lock/log/tmp). Docroot tetap :ro.
#   3. `cap_drop: ALL` lalu hanya capability yang dibutuhkan Apache prefork
#      untuk bind :80 dan turun ke user worker.
#   4. `no-new-privileges:true` — setuid binary di dalam container tidak bisa
#      menaikkan privilege.
#   5. Resource limit (pids/memory/cpus) supaya target yang di-OOM-kan tidak
#      menghabiskan host.
#   6. Jaringan `internal: true` — target TIDAK punya rute keluar (tanpa
#      default gateway, DNS gagal). Port publish tetap 127.0.0.1 lewat relay
#      socat di lab/lab_docker.sh, karena Docker tidak mem-publish port dari
#      jaringan internal.
#
# Catatan: isolasi egress di sini TERVERIFIKASI di lab (lihat
# reports/round2/DOCKER_LAB_REPORT.md), bukan asumsi dari dokumentasi.

services:
  target:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        P2S_UID: "${P2S_UID:-1000}"
        P2S_GID: "${P2S_GID:-1000}"
    image: p2s-lab:local
    platform: linux/amd64
    container_name: php2shell-target
    networks:
      - lab
    # Port TIDAK dipublish di sini: jaringan `lab` internal. Akses dari host
    # lewat relay socat (lab/lab_docker.sh) atau `docker network connect`.
    expose:
      - "80"
    volumes:
      - ./php.ini:/usr/local/etc/php/conf.d/zz-php2shell.ini:ro
      - ./apache.conf:/etc/apache2/conf-enabled/zz-php2shell.conf:ro
      - ./www:/var/www/html:ro
      # /out satu-satunya mount rw. Worker menulis sebagai uid host (mapping
      # di Dockerfile), jadi tidak perlu chown/chmod dari dalam container.
      - ../out:/out:rw
    read_only: true
    tmpfs:
      - /var/run/apache2:rw,mode=755
      - /var/lock/apache2:rw,mode=755
      - /var/log/apache2:rw,mode=755
      - /tmp:rw,mode=1777
    cap_drop:
      - ALL
    cap_add:
      # Apache prefork: bind :80 (NET_BIND_SERVICE), turun ke user worker
      # (SETUID/SETGID), dan chown file miliknya di tmpfs (CHOWN).
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 2.0
    restart: "no"

networks:
  lab:
    name: p2s-lab-internal
    internal: true
